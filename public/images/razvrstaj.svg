<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 752" width="1380" height="752">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="0.55" stop-color="#ffe7c2"/>
      <stop offset="1" stop-color="#fde2e4"/>
    </linearGradient>
    <linearGradient id="wicker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a458"/>
      <stop offset="1" stop-color="#b5762f"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b44a"/>
      <stop offset="1" stop-color="#e48a1c"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7a4a12" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1380" height="752" fill="url(#sky)"/>
  <circle cx="160" cy="130" r="90" fill="#fff" opacity="0.5"/>
  <circle cx="1240" cy="110" r="120" fill="#fff" opacity="0.45"/>
  <ellipse cx="690" cy="760" rx="820" ry="190" fill="#f9d29a" opacity="0.55"/>

  <!-- Natpis -->
  <g filter="url(#soft)">
    <rect x="470" y="46" width="440" height="104" rx="52" fill="url(#banner)"/>
  </g>
  <text x="690" y="118" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#fff" letter-spacing="3">RAZVRSTAJ</text>

  <!-- Predmet koji leti ka korpi -->
  <g transform="translate(690 250)">
    <path d="M-120 60 Q -40 -10 40 30" fill="none" stroke="#e48a1c" stroke-width="8" stroke-linecap="round" stroke-dasharray="6 22" opacity="0.7"/>
    <g transform="translate(70 20) rotate(-18)">
      <path d="M-60 10 C -50 -45 30 -60 66 -20 C 45 -38 -10 -30 -40 25 Z" fill="#f7d33a" stroke="#c99a12" stroke-width="5" stroke-linejoin="round"/>
      <path d="M62 -22 l14 -10" stroke="#6b4a1a" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Tri korpe -->
  <g filter="url(#soft)">
    <!-- Crvena -->
    <g transform="translate(250 430)">
      <circle cx="-40" cy="-6" r="50" fill="#e5484d"/>
      <circle cx="-40" cy="-6" r="50" fill="url(#shine)"/>
      <path d="M-40 -56 q8 -22 26 -26" stroke="#3f7d32" stroke-width="9" fill="none" stroke-linecap="round"/>
      <circle cx="40" cy="4" r="40" fill="#d63a3f"/>
      <circle cx="40" cy="4" r="40" fill="url(#shine)"/>
      <path d="M-150 20 H150 L125 210 Q118 236 92 236 H-92 Q-118 236 -125 210 Z" fill="url(#wicker)"/>
      <path d="M-140 70 H140 M-133 120 H133 M-127 170 H127" stroke="#9a6224" stroke-width="6" opacity="0.55"/>
      <rect x="-162" y="6" width="324" height="34" rx="17" fill="#c9893f"/>
      <circle cx="0" cy="-130" r="34" fill="#e5484d" stroke="#fff" stroke-width="8"/>
    </g>
    <!-- Žuta -->
    <g transform="translate(690 470)">
      <path d="M-70 6 C -60 -48 20 -64 58 -24 C 36 -42 -20 -34 -50 22 Z" fill="#f7d33a" stroke="#c99a12" stroke-width="5"/>
      <circle cx="40" cy="-4" r="38" fill="#fbd94c"/>
      <circle cx="40" cy="-4" r="38" fill="url(#shine)"/>
      <path d="M-150 20 H150 L125 210 Q118 236 92 236 H-92 Q-118 236 -125 210 Z" fill="url(#wicker)"/>
      <path d="M-140 70 H140 M-133 120 H133 M-127 170 H127" stroke="#9a6224" stroke-width="6" opacity="0.55"/>
      <rect x="-162" y="6" width="324" height="34" rx="17" fill="#c9893f"/>
      <circle cx="0" cy="-130" r="34" fill="#f5c518" stroke="#fff" stroke-width="8"/>
    </g>
    <!-- Zelena -->
    <g transform="translate(1130 430)">
      <circle cx="-36" cy="-8" r="48" fill="#3fb46f"/>
      <circle cx="-36" cy="-8" r="48" fill="url(#shine)"/>
      <path d="M-36 -56 q-4 -24 14 -32" stroke="#6b4a1a" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M20 10 q30 -70 80 -40 q-20 60 -80 40 Z" fill="#30a46c"/>
      <path d="M-150 20 H150 L125 210 Q118 236 92 236 H-92 Q-118 236 -125 210 Z" fill="url(#wicker)"/>
      <path d="M-140 70 H140 M-133 120 H133 M-127 170 H127" stroke="#9a6224" stroke-width="6" opacity="0.55"/>
      <rect x="-162" y="6" width="324" height="34" rx="17" fill="#c9893f"/>
      <circle cx="0" cy="-130" r="34" fill="#30a46c" stroke="#fff" stroke-width="8"/>
    </g>
  </g>
</svg>
