<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 752" width="1380" height="752">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9ee"/>
      <stop offset="0.55" stop-color="#ffe4ea"/>
      <stop offset="1" stop-color="#fdebe0"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7190"/>
      <stop offset="1" stop-color="#e23c64"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff4f6"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8a1738" flood-opacity="0.18"/>
    </filter>
    <!-- Auto -->
    <g id="car">
      <path d="M-62 4 L-44 -26 Q-40 -32 -32 -32 L26 -32 Q34 -32 40 -24 L56 -4 L74 2 Q82 6 82 16 L82 26 L-82 26 L-82 14 Q-82 4 -62 4 Z" fill="#ef4565"/>
      <path d="M-36 -2 L-26 -22 L-4 -22 L-4 -2 Z M4 -2 L4 -22 L24 -22 L38 -2 Z" fill="#cfe8ff"/>
      <circle cx="-46" cy="28" r="17" fill="#2b2552"/>
      <circle cx="-46" cy="28" r="7" fill="#d9d6ea"/>
      <circle cx="48" cy="28" r="17" fill="#2b2552"/>
      <circle cx="48" cy="28" r="7" fill="#d9d6ea"/>
      <path d="M-62 4 L-44 -26 Q-40 -32 -32 -32 L26 -32 Q34 -32 40 -24 L56 -4 L74 2 Q82 6 82 16 L82 26 L-82 26 L-82 14 Q-82 4 -62 4 Z" fill="url(#shine)"/>
    </g>
    <!-- Banana -->
    <g id="banana">
      <path d="M-70 -18 Q-58 34 0 38 Q52 40 76 -6 Q80 -14 72 -14 Q46 16 0 14 Q-44 12 -58 -24 Z" fill="#ffd34d" stroke="#e8b21c" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-70 -18 L-74 -30 L-62 -28 Z" fill="#7a4a22"/>
      <path d="M-70 -18 Q-58 34 0 38 Q52 40 76 -6 Q80 -14 72 -14 Q46 16 0 14 Q-44 12 -58 -24 Z" fill="url(#shine)"/>
    </g>
    <!-- Mačka -->
    <g id="cat">
      <path d="M-50 -18 L-44 -62 L-14 -36 Z M50 -18 L44 -62 L14 -36 Z" fill="#f59e3b"/>
      <ellipse cx="0" cy="0" rx="58" ry="46" fill="#f8ad55"/>
      <circle cx="-20" cy="-6" r="7" fill="#2b2552"/>
      <circle cx="20" cy="-6" r="7" fill="#2b2552"/>
      <path d="M-6 8 L6 8 L0 15 Z" fill="#e5484d"/>
      <path d="M0 15 Q-8 24 -16 20 M0 15 Q8 24 16 20" fill="none" stroke="#2b2552" stroke-width="4" stroke-linecap="round"/>
      <path d="M-30 10 L-62 4 M-30 16 L-60 20 M30 10 L62 4 M30 16 L60 20" stroke="#2b2552" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="0" cy="0" rx="58" ry="46" fill="url(#shine)"/>
    </g>
  </defs>

  <rect width="1380" height="752" fill="url(#sky)"/>
  <circle cx="150" cy="130" r="95" fill="#fff" opacity="0.5"/>
  <circle cx="1250" cy="120" r="120" fill="#fff" opacity="0.45"/>
  <ellipse cx="690" cy="770" rx="820" ry="170" fill="#fbc9d4" opacity="0.6"/>

  <!-- Natpis -->
  <g filter="url(#soft)">
    <rect x="490" y="46" width="400" height="104" rx="52" fill="url(#banner)"/>
  </g>
  <text x="690" y="118" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#fff" letter-spacing="3">SLOVA</text>

  <g filter="url(#soft)">
    <!-- A kao auto: gotovo slovo, svaki potez u svojoj boji -->
    <g transform="translate(250 450)">
      <rect x="-170" y="-200" width="340" height="420" rx="44" fill="url(#card)" stroke="#f7b9c7" stroke-width="6"/>
      <line x1="-140" x2="140" y1="35" y2="35" stroke="#f3cdd6" stroke-width="4"/>
      <g fill="none" stroke-linecap="round" stroke-width="22">
        <path d="M0 -175 L-67 35" stroke="#7c5cf0"/>
        <path d="M0 -175 L67 35" stroke="#0e9bd8"/>
        <path d="M-40 -45 L40 -45" stroke="#12a37a"/>
      </g>
      <use href="#car" transform="translate(0 128)"/>
    </g>

    <!-- B kao banana: precrtavanje u toku, tačka „prati me” -->
    <g transform="translate(690 450)">
      <rect x="-170" y="-200" width="340" height="420" rx="44" fill="url(#card)" stroke="#f7b9c7" stroke-width="6"/>
      <line x1="-140" x2="140" y1="35" y2="35" stroke="#f3cdd6" stroke-width="4"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-59 -175 L-59 35 M-59 -175 L-4 -175 A50 50 0 0 1 -4 -74 L-59 -74 M-59 -74 L4 -74 A55 55 0 0 1 4 35 L-59 35" stroke="#f1e4ea" stroke-width="40"/>
        <path d="M-59 -175 L-59 35 M-59 -175 L-4 -175 A50 50 0 0 1 -4 -74 L-59 -74 M-59 -74 L4 -74 A55 55 0 0 1 4 35 L-59 35" stroke="#c4a9b6" stroke-width="9" stroke-dasharray="0.1 17"/>
        <path d="M-59 -175 L-59 35" stroke="#7c5cf0" stroke-width="22"/>
        <path d="M-59 -175 L-4 -175 A50 50 0 0 1 46 -125" stroke="#0e9bd8" stroke-width="22"/>
      </g>
      <circle cx="46" cy="-125" r="26" fill="#6c61f0" opacity="0.25"/>
      <circle cx="46" cy="-125" r="17" fill="#6c61f0" stroke="#fff" stroke-width="6"/>
      <circle cx="-92" cy="-74" r="19" fill="#fff" stroke="#f59e0b" stroke-width="5"/>
      <text x="-92" y="-65" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#955005">3</text>
      <use href="#banana" transform="translate(0 132)"/>
    </g>

    <!-- M kao mačka: tanka linija, brojevi i strelice pokazuju redosled -->
    <g transform="translate(1130 450)">
      <rect x="-170" y="-200" width="340" height="420" rx="44" fill="url(#card)" stroke="#f7b9c7" stroke-width="6"/>
      <line x1="-140" x2="140" y1="35" y2="35" stroke="#f3cdd6" stroke-width="4"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#b09aa6" stroke-width="8" stroke-dasharray="0.1 15">
        <path d="M-63 -175 L-63 35"/>
        <path d="M-63 -175 L0 -41 L63 -175 L63 35"/>
      </g>
      <g fill="#f59e0b">
        <path d="M-63 -175 L-63 -125" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
        <path d="M-75 -128 L-63 -108 L-51 -128 Z"/>
        <path d="M-63 -175 L-42 -130" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
        <path d="M-52 -128 L-36 -116 L-34 -138 Z"/>
      </g>
      <circle cx="-63" cy="-175" r="17" fill="#6c61f0" stroke="#fff" stroke-width="6"/>
      <circle cx="-100" cy="-175" r="19" fill="#fff" stroke="#f59e0b" stroke-width="5"/>
      <text x="-100" y="-166" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#955005">1</text>
      <circle cx="-28" cy="-188" r="19" fill="#fff" stroke="#f59e0b" stroke-width="5"/>
      <text x="-28" y="-179" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#955005">2</text>
      <use href="#cat" transform="translate(0 132)"/>
    </g>
  </g>
</svg>
