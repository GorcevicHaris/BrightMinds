<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 752" width="1380" height="752">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdeafd"/>
      <stop offset="0.55" stop-color="#f8e0fb"/>
      <stop offset="1" stop-color="#ece6ff"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e46cf0"/>
      <stop offset="1" stop-color="#c03fd0"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5e1466" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1380" height="752" fill="url(#sky)"/>
  <circle cx="150" cy="120" r="95" fill="#fff" opacity="0.5"/>
  <circle cx="1250" cy="640" r="130" fill="#fff" opacity="0.4"/>
  <ellipse cx="690" cy="770" rx="820" ry="170" fill="#efc6f4" opacity="0.5"/>

  <!-- Natpis -->
  <g filter="url(#soft)">
    <rect x="400" y="46" width="580" height="104" rx="52" fill="url(#banner)"/>
  </g>
  <text x="690" y="118" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#fff" letter-spacing="2">ČEMU SLUŽI?</text>

  <g filter="url(#soft)">
    <!-- Kartica: ključ -->
    <g transform="translate(250 480)">
      <rect x="-170" y="-170" width="340" height="340" rx="40" fill="#fff"/>
      <g transform="rotate(-35)">
        <circle cx="-70" cy="0" r="56" fill="#f5c518" stroke="#c99a12" stroke-width="8"/>
        <circle cx="-70" cy="0" r="22" fill="#fff" stroke="#c99a12" stroke-width="6"/>
        <rect x="-18" y="-16" width="160" height="32" rx="10" fill="#f5c518" stroke="#c99a12" stroke-width="6"/>
        <path d="M100 14 v34 h22 v-34 M60 14 v26 h22 v-26" fill="#f5c518" stroke="#c99a12" stroke-width="6" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Kartica: olovka (izabrana) -->
    <g transform="translate(690 480)">
      <rect x="-170" y="-170" width="340" height="340" rx="40" fill="#fff" stroke="#c03fd0" stroke-width="10"/>
      <g transform="rotate(40)">
        <rect x="-110" y="-28" width="170" height="56" fill="#ffd34d" stroke="#d99b0c" stroke-width="6"/>
        <rect x="-140" y="-28" width="34" height="56" rx="10" fill="#f28ca0" stroke="#d9667e" stroke-width="6"/>
        <rect x="-112" y="-28" width="16" height="56" fill="#c7ccd6"/>
        <path d="M60 -28 L130 0 L60 28 Z" fill="#f7deb8" stroke="#d99b0c" stroke-width="6" stroke-linejoin="round"/>
        <path d="M108 -9 L130 0 L108 9 Z" fill="#3a2a1a"/>
      </g>
      <circle cx="128" cy="-128" r="34" fill="#30a46c"/>
      <path d="M112 -128 l12 12 l22 -24" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Kartica: kašika -->
    <g transform="translate(1130 480)">
      <rect x="-170" y="-170" width="340" height="340" rx="40" fill="#fff"/>
      <g transform="rotate(35)">
        <ellipse cx="0" cy="-60" rx="54" ry="74" fill="#c7ccd6" stroke="#8f97a6" stroke-width="7"/>
        <ellipse cx="-10" cy="-74" rx="22" ry="34" fill="url(#shine)"/>
        <rect x="-14" y="8" width="28" height="140" rx="14" fill="#c7ccd6" stroke="#8f97a6" stroke-width="7"/>
      </g>
    </g>
  </g>

  <!-- Oblačić sa pitanjem -->
  <g filter="url(#soft)">
    <path d="M1030 168 h150 a40 40 0 0 1 40 40 v40 a40 40 0 0 1 -40 40 h-100 l-40 30 v-30 h-10 a40 40 0 0 1 -40 -40 v-40 a40 40 0 0 1 40 -40z" fill="#fff"/>
  </g>
  <text x="1105" y="262" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="88" font-weight="800" fill="#c03fd0">?</text>
</svg>
