<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 752" width="1380" height="752">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f8ea"/>
      <stop offset="0.55" stop-color="#dcf5e4"/>
      <stop offset="1" stop-color="#e2f4f1"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fcf78"/>
      <stop offset="1" stop-color="#17a454"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2fbf5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0d5a2e" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1380" height="752" fill="url(#sky)"/>
  <circle cx="150" cy="130" r="95" fill="#fff" opacity="0.5"/>
  <circle cx="1250" cy="120" r="120" fill="#fff" opacity="0.45"/>
  <ellipse cx="690" cy="770" rx="820" ry="170" fill="#bfe9cf" opacity="0.6"/>

  <!-- Natpis -->
  <g filter="url(#soft)">
    <rect x="470" y="46" width="440" height="104" rx="52" fill="url(#banner)"/>
  </g>
  <text x="690" y="118" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#fff" letter-spacing="3">BROJEVI</text>

  <g filter="url(#soft)">
    <!-- 2: gotova cifra i dve tačkice -->
    <g transform="translate(250 430)">
      <rect x="-170" y="-200" width="340" height="400" rx="44" fill="url(#card)" stroke="#a9e4bf" stroke-width="6"/>
      <line x1="-140" x2="140" y1="35" y2="35" stroke="#cdeed9" stroke-width="4"/>
      <path d="M-58.8 -130.9 A56.7 56.7 0 1 1 49.1 -96.9 L-58.8 35 L58.8 35" fill="none" stroke="#7c5cf0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#3b82f6">
        <circle cx="-34" cy="112" r="22"/>
        <circle cx="34" cy="112" r="22"/>
      </g>
    </g>

    <!-- 5: pisanje u toku, tačka „prati me” -->
    <g transform="translate(690 430)">
      <rect x="-170" y="-200" width="340" height="400" rx="44" fill="url(#card)" stroke="#a9e4bf" stroke-width="6"/>
      <line x1="-140" x2="140" y1="35" y2="35" stroke="#cdeed9" stroke-width="4"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-42 -175 L-50.4 -78.4 L-49.4 -72.7 A58.8 63 0 0 1 54.6 -32.2 A58.8 63 0 0 1 -55.1 -0.7 M-42 -175 L46.2 -175" stroke="#e3f1e8" stroke-width="40"/>
        <path d="M54.6 -32.2 A58.8 63 0 0 1 -55.1 -0.7 M-42 -175 L46.2 -175" stroke="#9fc3ad" stroke-width="9" stroke-dasharray="0.1 17"/>
        <path d="M-42 -175 L-50.4 -78.4 L-49.4 -72.7 A58.8 63 0 0 1 54.6 -32.2" stroke="#7c5cf0" stroke-width="22"/>
      </g>
      <circle cx="54.6" cy="-32.2" r="26" fill="#6c61f0" opacity="0.25"/>
      <circle cx="54.6" cy="-32.2" r="17" fill="#6c61f0" stroke="#fff" stroke-width="6"/>
      <circle cx="-42" cy="-175" r="19" fill="#fff" stroke="#f59e0b" stroke-width="5"/>
      <text x="-42" y="-166" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#955005">2</text>
      <g fill="#3b82f6">
        <circle cx="-100" cy="112" r="17"/>
        <circle cx="-50" cy="112" r="17"/>
        <circle cx="0" cy="112" r="17"/>
        <circle cx="50" cy="112" r="17"/>
        <circle cx="100" cy="112" r="17"/>
      </g>
    </g>

    <!-- 7: isprekidano, sa brojem i strelicom za prvi potez -->
    <g transform="translate(1130 430)">
      <rect x="-170" y="-200" width="340" height="400" rx="44" fill="url(#card)" stroke="#a9e4bf" stroke-width="6"/>
      <line x1="-140" x2="140" y1="35" y2="35" stroke="#cdeed9" stroke-width="4"/>
      <path d="M-56.7 -175 L56.7 -175 L-18.9 35" fill="none" stroke="#9fc3ad" stroke-width="9" stroke-dasharray="0.1 17" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-56.7 -175 L-6 -175" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
      <path d="M-10 -188 L12 -175 L-10 -162 Z" fill="#f59e0b"/>
      <circle cx="-56.7" cy="-175" r="17" fill="#6c61f0" stroke="#fff" stroke-width="6"/>
      <circle cx="-96" cy="-175" r="19" fill="#fff" stroke="#f59e0b" stroke-width="5"/>
      <text x="-96" y="-166" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#955005">1</text>
      <g fill="#3b82f6">
        <circle cx="-90" cy="92" r="15"/>
        <circle cx="-45" cy="92" r="15"/>
        <circle cx="0" cy="92" r="15"/>
        <circle cx="45" cy="92" r="15"/>
        <circle cx="90" cy="92" r="15"/>
        <circle cx="-90" cy="136" r="15"/>
        <circle cx="-45" cy="136" r="15"/>
      </g>
    </g>
  </g>

  <!-- Brojevna prava: 1 2 ? 4 -->
  <g font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="40" font-weight="900" text-anchor="middle">
    <rect x="530" y="660" width="64" height="64" rx="16" fill="#fff" stroke="#a9e4bf" stroke-width="4"/>
    <text x="562" y="706" fill="#1f6b3d">1</text>
    <rect x="610" y="660" width="64" height="64" rx="16" fill="#fff" stroke="#a9e4bf" stroke-width="4"/>
    <text x="642" y="706" fill="#1f6b3d">2</text>
    <rect x="690" y="660" width="64" height="64" rx="16" fill="#eef0ff" stroke="#8b86f5" stroke-width="4" stroke-dasharray="8 7"/>
    <text x="722" y="706" fill="#8b86f5">?</text>
    <rect x="770" y="660" width="64" height="64" rx="16" fill="#fff" stroke="#a9e4bf" stroke-width="4"/>
    <text x="802" y="706" fill="#1f6b3d">4</text>
  </g>
</svg>
