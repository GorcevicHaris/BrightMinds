<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 752" width="1380" height="752">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3edff"/>
      <stop offset="0.55" stop-color="#dbe7fe"/>
      <stop offset="1" stop-color="#e8e6ff"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8ff9"/>
      <stop offset="1" stop-color="#2f62e0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5ff"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#173a8a" flood-opacity="0.2"/>
    </filter>
    <!-- Jabuka -->
    <g id="apple">
      <path d="M0 -38 C-8 -58 -30 -60 -38 -52" fill="none" stroke="#7a4a22" stroke-width="7" stroke-linecap="round"/>
      <path d="M4 -42 C18 -64 44 -60 48 -46 C34 -36 16 -36 4 -42 Z" fill="#4caf50"/>
      <path d="M0 -30 C-30 -52 -68 -34 -66 6 C-64 46 -34 70 -14 66 C-6 64 -4 60 0 60 C4 60 6 64 14 66 C34 70 64 46 66 6 C68 -34 30 -52 0 -30 Z" fill="#e5484d"/>
      <path d="M0 -30 C-30 -52 -68 -34 -66 6 C-64 46 -34 70 -14 66 C-6 64 -4 60 0 60 C4 60 6 64 14 66 C34 70 64 46 66 6 C68 -34 30 -52 0 -30 Z" fill="url(#shine)"/>
    </g>
    <!-- Balon -->
    <g id="balloon">
      <path d="M0 62 Q-10 90 6 112 Q18 128 4 150" fill="none" stroke="#7d8fb8" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="0" cy="0" rx="52" ry="62" fill="#ffb020"/>
      <ellipse cx="0" cy="0" rx="52" ry="62" fill="url(#shine)"/>
      <path d="M-10 60 L10 60 L0 72 Z" fill="#e0901a"/>
    </g>
    <!-- Zvezda -->
    <g id="star">
      <path d="M0 -50 L14 -16 L50 -14 L22 10 L32 46 L0 26 L-32 46 L-22 10 L-50 -14 L-14 -16 Z" fill="#ffd34d" stroke="#f2b01e" stroke-width="5" stroke-linejoin="round"/>
      <path d="M0 -50 L14 -16 L50 -14 L22 10 L32 46 L0 26 L-32 46 L-22 10 L-50 -14 L-14 -16 Z" fill="url(#shine)"/>
    </g>
  </defs>

  <rect width="1380" height="752" fill="url(#sky)"/>
  <circle cx="150" cy="130" r="95" fill="#fff" opacity="0.5"/>
  <circle cx="1250" cy="120" r="120" fill="#fff" opacity="0.45"/>
  <ellipse cx="690" cy="770" rx="820" ry="170" fill="#c4d6fb" opacity="0.6"/>

  <!-- Natpis -->
  <g filter="url(#soft)">
    <rect x="470" y="46" width="440" height="104" rx="52" fill="url(#banner)"/>
  </g>
  <text x="690" y="118" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#fff" letter-spacing="3">BROJIMO</text>

  <g filter="url(#soft)">
    <!-- 1: jedna jabuka -->
    <g transform="translate(250 450)">
      <rect x="-170" y="-200" width="340" height="420" rx="44" fill="url(#card)" stroke="#bcd0fb" stroke-width="6"/>
      <text x="0" y="-70" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="#2f62e0">1</text>
      <use href="#apple" transform="translate(0 95) scale(1.45)"/>
    </g>

    <!-- 2: dva balona -->
    <g transform="translate(690 450)">
      <rect x="-170" y="-200" width="340" height="420" rx="44" fill="url(#card)" stroke="#bcd0fb" stroke-width="6"/>
      <text x="0" y="-70" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="#2f62e0">2</text>
      <use href="#balloon" transform="translate(-72 40) scale(1.15)"/>
      <use href="#balloon" transform="translate(72 40) scale(1.15)"/>
    </g>

    <!-- 3: tri zvezde -->
    <g transform="translate(1130 450)">
      <rect x="-170" y="-200" width="340" height="420" rx="44" fill="url(#card)" stroke="#bcd0fb" stroke-width="6"/>
      <text x="0" y="-70" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="#2f62e0">3</text>
      <use href="#star" transform="translate(-104 105) scale(1.02)"/>
      <use href="#star" transform="translate(0 105) scale(1.02)"/>
      <use href="#star" transform="translate(104 105) scale(1.02)"/>
    </g>
  </g>

  <!-- Tačkice ispod kartica (broj ↔ količina) -->
  <g fill="#5b8ff9">
    <circle cx="250" cy="700" r="13"/>
    <circle cx="672" cy="700" r="13"/>
    <circle cx="708" cy="700" r="13"/>
    <circle cx="1094" cy="700" r="13"/>
    <circle cx="1130" cy="700" r="13"/>
    <circle cx="1166" cy="700" r="13"/>
  </g>
</svg>
